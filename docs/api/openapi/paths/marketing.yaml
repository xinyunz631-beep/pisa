                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/NotificationTemplate'
      '400':
        description: 参数校验失败（名称 / 内容超长、内容为空、枚举非法）
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限

notification-templates-id:
  put:
    tags: [营销]
    operationId: updateNotificationTemplate
    summary: 编辑通知模板
    description: summary 与 updatedAt 由后端重新生成；sendCount、status 不接受修改。
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/NotificationTemplateInput'
    responses:
      '200':
        description: 成功，返回保存后的模板对象
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/NotificationTemplate'
      '400':
        description: 参数校验失败
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 通知模板不存在
  delete:
    tags: [营销]
    operationId: deleteNotificationTemplate
    summary: 删除通知模板
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    responses:
      '200':
        description: 成功，data 为 null
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiEnvelope'
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 通知模板不存在
      '409':
        description: 模板已被发送任务引用，禁止删除

notification-templates-id-status:
  patch:
    tags: [营销]
    operationId: updateNotificationTemplateStatus
    summary: 通知模板启用 / 停用
    description: enabled=true 时 status 置为 enabled，enabled=false 时置为 disabled；历史 sendCount 保留。
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/StatusInput'
    responses:
      '200':
        description: 成功，data 为 null
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiEnvelope'
      '400':
        description: enabled 非布尔
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 通知模板不存在

audience-tags:
  get:
    tags: [营销]
    operationId: listAudienceTags
    summary: 人群标签选项
    description: 返回启用的会员标签名称数组，发券任务与自动化计划共用；数据源为 GET /api/v1/member-tags?status=enabled。
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: string
                      example: [全部会员, 新客, 高频到店, 沉默会员, 价格敏感, 外卖偏好, 周末消费, 生日本月, 亲子客群, 学生客群, 企业客户, 金卡会员]
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限

activities-options:
  get:
    tags: [营销]
    operationId: listMarketingActivityOptions
    summary: 营销活动选项
    description: 自动化计划「关联活动」下拉选项，聚合满减、满折、发券三类活动，按满减 → 满折 → 发券分组排序。
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../schemas/marketing.yaml#/MarketingActivityOption'
                      example:
                        - value: FR001
                          label: 国庆满减狂欢
                          activityType: 满减活动
                        - value: FD001
                          label: 中秋满折特惠
                          activityType: 满折活动
                        - value: CP001
                          label: 双十一新客拉新
                          activityType: 发券活动
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
