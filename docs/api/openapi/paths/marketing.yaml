coupon-tasks:
  get:
    tags: [营销]
    operationId: listCouponTasks
    summary: 发券任务分页列表
    description: 支持按任务名称或券名称模糊搜索、按状态筛选，默认按创建时间倒序。
    parameters:
      - name: keyword
        in: query
        required: false
        description: 任务名称或券名称模糊匹配（包含任一即命中）
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: 任务状态，all 或省略表示全部
        schema:
          type: string
          enum: [running, ended, paused, all]
      - $ref: '../schemas/common.yaml#/parameters/Page'
      - $ref: '../schemas/common.yaml#/parameters/PageSize'
      - $ref: '../schemas/common.yaml#/parameters/StoreIdHeader'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/PagedCouponTasks'
      '400':
        description: 参数校验失败
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
  post:
    tags: [营销]
    operationId: createCouponTask
    summary: 新增发券任务
    description: 新建任务固定 status=running、claimed=0，couponName 由后端按 couponId join 卡券表返回。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/CouponTaskInput'
    responses:
      '200':
        description: 成功，返回保存后的任务对象
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/CouponTask'
      '400':
        description: 参数校验失败（名称超长、人群为空、数量越界、日期倒挂）
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 卡券或人群标签不存在

coupon-tasks-id:
  put:
    tags: [营销]
    operationId: updateCouponTask
    summary: 编辑发券任务
    description: 仅可修改名称、券、人群、计划数量与有效期，claimed / status / createdAt 不接受修改。
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/CouponTaskInput'
    responses:
      '200':
        description: 成功，返回保存后的任务对象
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/CouponTask'
      '400':
        description: 参数校验失败
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 发券任务或卡券不存在
  delete:
    tags: [营销]
    operationId: deleteCouponTask
    summary: 删除发券任务
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    responses:
      '200':
        description: 成功，data 为 null
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiEnvelope'
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 发券任务不存在
      '409':
        description: 任务已被自动化计划引用或已产生领取记录，禁止删除

automation-plans:
  get:
    tags: [营销]
    operationId: listAutomationPlans
    summary: 自动化计划分页列表
    description: 支持按计划名称模糊搜索、按渠道、按状态筛选；渠道筛选为任一命中（计划 channels 包含该值即返回）。
    parameters:
      - name: keyword
        in: query
        required: false
        description: 计划名称模糊匹配（包含）
        schema:
          type: string
      - name: channel
        in: query
        required: false
        description: 触达渠道，all 或省略表示全部
        schema:
          type: string
          enum: [sms, wechat, inbox, all]
      - name: status
        in: query
        required: false
        description: 计划状态，all 或省略表示全部
        schema:
          type: string
          enum: [enabled, paused, all]
      - $ref: '../schemas/common.yaml#/parameters/Page'
      - $ref: '../schemas/common.yaml#/parameters/PageSize'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/PagedAutomationPlans'
      '400':
        description: 参数校验失败（channel / status 非法）
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
  post:
    tags: [营销]
    operationId: createAutomationPlan
    summary: 新增自动化计划
    description: 新建计划固定 status=enabled；activityName / activityType 由后端按 activityId 反查填充。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/AutomationPlanInput'
    responses:
      '200':
        description: 成功，返回保存后的计划对象
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/AutomationPlan'
      '400':
        description: 参数校验失败（名称超长、活动 / 人群 / 渠道为空、触发规则超长、枚举非法）
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 关联活动不存在

automation-plans-id:
  put:
    tags: [营销]
    operationId: updateAutomationPlan
    summary: 编辑自动化计划
    description: 编辑不改变 status 与 createdAt；activityName / activityType 始终由 activityId 反查。
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/AutomationPlanInput'
    responses:
      '200':
        description: 成功，返回保存后的计划对象
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/AutomationPlan'
      '400':
        description: 参数校验失败
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 自动化计划或关联活动不存在
  delete:
    tags: [营销]
    operationId: deleteAutomationPlan
    summary: 删除自动化计划
    description: 建议仅允许删除已暂停计划，执行中的计划应先暂停再删除。
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    responses:
      '200':
        description: 成功，data 为 null
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiEnvelope'
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 自动化计划不存在

automation-plans-id-status:
  patch:
    tags: [营销]
    operationId: updateAutomationPlanStatus
    summary: 自动化计划启用 / 暂停
    description: enabled=true 时 status 置为 enabled，enabled=false 时置为 paused。
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/StatusInput'
    responses:
      '200':
        description: 成功，data 为 null
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiEnvelope'
      '400':
        description: enabled 非布尔
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 自动化计划不存在

