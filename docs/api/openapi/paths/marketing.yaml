# 营销模块接口

full-reductions:
  get:
    tags: [营销]
    operationId: listFullReductions
    summary: 满减活动分页列表
    description: 支持按活动名称模糊搜索、按状态筛选、按活动时间区间筛选（与活动窗口有交集即命中），默认按创建时间倒序。
    parameters:
      - name: keyword
        in: query
        required: false
        description: 活动名称模糊匹配（包含），trim 后为空视为不筛选
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: 活动状态，all 或省略表示全部
        schema:
          type: string
          enum: [notStarted, running, ended, disabled, all]
      - name: startDate
        in: query
        required: false
        description: 活动时间区间起始日 YYYY-MM-DD（含），需与 endDate 成对出现
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        description: 活动时间区间结束日 YYYY-MM-DD（含），需与 startDate 成对出现
        schema:
          type: string
          format: date
      - $ref: '../schemas/common.yaml#/parameters/Page'
      - $ref: '../schemas/common.yaml#/parameters/PageSize'
      - $ref: '../schemas/common.yaml#/parameters/StoreIdHeader'
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/PagedFullReductions'
      '400':
        description: 参数校验失败（日期格式错误或未成对、page / pageSize 非法）
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
  post:
    tags: [营销]
    operationId: createFullReduction
    summary: 新增满减活动
    description: 写入时只传 storeIds，返回的 storeNames 由后端 join 门店表得到；status 以请求体为准，不做时间派生。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/FullReductionInput'
    responses:
      '200':
        description: 成功，返回保存后的活动对象
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/FullReductionActivity'
      '400':
        description: 参数校验失败（名称超长、门店为空或不存在、时间倒挂、规则非法）
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 门店不存在
      '409':
        description: 同一门店 + 时间段活动重叠

full-reductions-id:
  put:
    tags: [营销]
    operationId: updateFullReduction
    summary: 编辑满减活动
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/FullReductionInput'
    responses:
      '200':
        description: 成功，返回保存后的活动对象
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/FullReductionActivity'
      '400':
        description: 参数校验失败
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 满减活动不存在
      '409':
        description: 同一门店 + 时间段活动重叠
  delete:
    tags: [营销]
    operationId: deleteFullReduction
    summary: 删除满减活动
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    responses:
      '200':
        description: 成功，data 为 null
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiEnvelope'
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 满减活动不存在
      '409':
        description: 活动已被自动化计划引用，禁止删除

full-reductions-id-status:
  patch:
    tags: [营销]
    operationId: updateFullReductionStatus
    summary: 满减活动启用 / 停用
    description: enabled=true 时按 startAt / endAt 与当前时间重新派生状态，enabled=false 时置为 disabled，均不修改起止时间。
    parameters:
      - $ref: '../schemas/common.yaml#/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/StatusInput'
    responses:
      '200':
        description: 成功，data 为 null
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiEnvelope'
      '400':
        description: enabled 非布尔
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
      '404':
        description: 满减活动不存在

