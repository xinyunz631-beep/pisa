                  properties:
                    data:
                      $ref: '../schemas/marketing.yaml#/PagedNotificationTemplates'
      '400':
        description: 参数校验失败（channel / status 非法）
      '401':
        description: 未登录 / token 失效
      '403':
        description: 无权限
  post:
    tags: [营销]
    operationId: createNotificationTemplate
    summary: 新增通知模板
    description: 新建模板固定 status=enabled、sendCount=0，summary 与 updatedAt 由后端生成。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/marketing.yaml#/NotificationTemplateInput'
