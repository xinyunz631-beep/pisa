# 订单模块 schema
# 对应 docs/api/07-order.md；Order 同时被 schemas/dashboard.yaml 的 recentOrders 引用，名称不可改。

Order:
  type: object
  description: 订单（含商品明细快照）
  required: [id, storeId, storeName, channel, status, customer, phone, amount, items, createdAt]
  properties:
    id:
      type: string
      description: 订单号，BS + YYYYMMDD（下单日期）+ 4 位当日序号；全局唯一且不可变
      example: BS202611040001
    storeId:
      type: string
      description: 门店编号
      example: ST007
    storeName:
      type: string
      description: 门店名称（冗余展示字段）
      example: 杭州西湖店
    channel:
      type: string
      description: dine-in=堂食，takeaway=自提，delivery=外卖
      enum: [dine-in, takeaway, delivery]
    status:
      type: string
      description: pending=待接单，serving=制作中，completed=已完成，refunded=已退款
      enum: [pending, serving, completed, refunded]
    tableNo:
      type: string
      nullable: true
      description: 桌号，仅堂食返回；自提/外卖为 null 或缺省
      example: A11
    customer:
      type: string
      description: 客户姓名
      example: 张伟
    phone:
      type: string
      description: 联系电话；服务端按权限返回明文或脱敏（Mock 为脱敏格式）
      example: '177****1376'
    amount:
      type: number
      description: 订单金额（元），= Σ(items.price × qty)；Mock 无优惠/配送费
      example: 66
    items:
      type: array
      description: 商品明细（下单快照，菜品后续改价/删除不影响历史订单）
      items:
        $ref: '#/OrderItem'
    createdAt:
      type: string
      description: 下单时间，YYYY-MM-DD HH:mm:ss（Mock 数据只到分钟）
      example: '2026-11-04 16:18'

OrderItem:
  type: object
  description: 订单商品明细行（下单时快照）
  required: [dishId, name, qty, price]
  properties:
    dishId:
      type: string
      description: 菜品编号
      example: D022
    name:
      type: string
      description: 菜品名称（快照）
      example: 酸辣土豆丝
    qty:
      type: integer
      minimum: 1
      description: 数量
      example: 3
    price:
      type: number
      description: 单价（元，下单时价格快照）
      example: 22

PagedOrders:
  allOf:
    - $ref: './common.yaml#/Pagination'
    - type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/Order'
