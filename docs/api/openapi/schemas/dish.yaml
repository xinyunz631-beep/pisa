# 菜品模块 schema
# 对应 docs/api/06-dish.md。

Dish:
  type: object
  description: 菜品
  required: [id, code, name, category, price, cost, stock, images, skus, attributeBindings, sales, status, description, updatedAt]
  properties:
    id:
      type: string
      description: 系统菜品编号，D + 3 位序号；新增时由服务端生成
      example: D001
    code:
      type: string
      description: 商品编码（SPU 编码），全局唯一
      example: SPU001
    name:
      type: string
      maxLength: 30
      description: 菜品名称
      example: 麻辣香锅
    category:
      type: string
      description: 所属分类，取值来自分类选项接口
      example: 招牌主菜
    price:
      type: number
      minimum: 0
      description: 售价（元）
      example: 68
    cost:
      type: number
      minimum: 0
      description: 成本（元），仅用于成本/毛利核算，不在列表展示
      example: 26
    stock:
      type: integer
      minimum: 0
      description: 当前库存（份）= 全部 SKU 库存合计，0 表示缺货
      example: 12
    images:
      type: array
      maxItems: 6
      description: 商品图（URL），最多 6 张；Mock 为内联 SVG dataURL
      items:
        type: string
      example: ['data:image/svg+xml;charset=utf-8,…']
    skus:
      type: array
      minItems: 1
      description: 规格（SKU）列表，至少 1 条；SPU 的 price/stock 由它汇总
      items:
        $ref: '#/DishSku'
    attributeBindings:
      type: array
      description: 做法 / 口味属性绑定（可空）：引用属性组，可按本商品覆盖选项加价
      items:
        $ref: '#/DishAttributeBinding'
    sales:
      type: integer
      minimum: 0
      description: 累计销量（只读，新增时服务端置 0）
      example: 1749
    status:
      type: string
      description: on=在售，off=已下架
      enum: ['on', 'off']
    description:
      type: string
      maxLength: 120
      description: 菜品描述
      example: 招牌麻辣锅底，可选微辣/中辣/特辣
    updatedAt:
      type: string
      description: 更新时间，YYYY-MM-DD HH:mm:ss（Mock 数据只到分钟）
      example: '2026-11-03 09:00'

DishInput:
  type: object
  description: 新增 / 编辑菜品的请求体（SPU + SKU；新增走 POST，编辑走 PUT，均不传 id）
  required: [code, name, category, cost, skus, status]
  properties:
    code:
      type: string
      description: 商品编码（SPU），全局唯一，如 SPU029
      example: SPU029
    name:
      type: string
      minLength: 1
      maxLength: 30
      example: 蒜蓉西兰花
    category:
      type: string
      description: 分类名称，须存在于分类字典
      example: 小炒
    cost:
      type: number
      minimum: 0
      multipleOf: 0.01
      description: 成本（元），最多 2 位小数；用于对账单成本核算
      example: 10
    images:
      type: array
      maxItems: 6
      description: 商品图（URL / dataURL），最多 6 张
      items:
        type: string
    skus:
      type: array
      minItems: 1
      description: 规格列表，至少 1 条
      items:
        $ref: '#/DishSkuInput'
    attributeBindings:
      type: array
      description: 做法属性绑定（可选）；不存在的属性组 / 选项会被忽略
      items:
        $ref: '#/DishAttributeBinding'
    status:
      type: string
      enum: ['on', 'off']
      description: 售卖状态
    description:
      type: string
      maxLength: 120
      description: 菜品描述，缺省保存为空串
      example: 现炒蒜香，清爽解腻

DishSku:
  type: object
  description: 商品规格（SKU）
  required: [id, code, specName, price, stock]
  properties:
    id:
      type: string
      description: SKU 系统编号，{菜品id}-序号，如 D001-01
      example: D001-01
    code:
      type: string
      description: SKU 编码，建议同一 SPU 内唯一
      example: SPU001-01
    specName:
      type: string
      description: 规格名称
      example: 小份
    price:
      type: number
      minimum: 0
      description: 该规格售价（元）
      example: 68
    stock:
      type: integer
      minimum: 0
      description: 该规格库存（份）
      example: 7

DishSkuInput:
  type: object
  description: 规格入参（新增 / 编辑菜品时提交）
  required: [code, specName, price, stock]
  properties:
    code:
      type: string
      description: SKU 编码
      example: SPU029-01
    specName:
      type: string
      description: 规格名称
      example: 标准份
    price:
      type: number
      minimum: 0
      multipleOf: 0.01
      description: 售价（元），最多 2 位小数
      example: 28
    stock:
      type: integer
      minimum: 0
      maximum: 9999
      description: 库存（份）
      example: 100

DishAttributeBinding:
  type: object
  description: 商品对属性组的引用配置。属性组选项设置默认加价；商品引用时可重新设置本商品加价，未设置则取默认值
  required: [groupId]
  properties:
    groupId:
      type: string
      description: 引用的做法属性组 ID
      example: A004
    required:
      type: boolean
      description: 覆盖属性组的「是否必选」，缺省继承属性组配置
      example: false
    optionPrices:
      type: object
      additionalProperties:
        type: number
        minimum: 0
      description: 本商品选项加价覆盖（key 为选项 ID）。未出现的选项取属性组默认加价；显式设置为 0 表示本商品免费
      example: { A004-O1: 0 }
    disabledOptionIds:
      type: array
      description: 本商品不提供的选项 ID
      items:
        type: string
      example: ['A004-O2']

PagedDishes:
  allOf:
    - $ref: './common.yaml#/Pagination'
    - type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/Dish'

DishStatusInput:
  type: object
  description: 菜品上下架请求体
  required: [status]
  properties:
    status:
      type: string
      enum: ['on', 'off']
      description: on=上架（在售），off=下架
