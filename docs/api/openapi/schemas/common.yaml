# 通用响应 / 参数 / 分页片段（被各模块 paths 与 schemas 引用）

ApiEnvelope:
  type: object
  description: 统一响应包裹
  required: [code, message]
  properties:
    code:
      type: integer
      description: 0 表示成功；非 0 为业务错误码（40001/40100/40300/40400/40900/50000）
      example: 0
    message:
      type: string
      example: ok
    data:
      description: 业务数据，结构见各接口定义

Pagination:
  type: object
  description: 分页信息
  required: [total, page, pageSize]
  properties:
    total:
      type: integer
      description: 总条数
      example: 46
    page:
      type: integer
      description: 当前页码
      example: 1
    pageSize:
      type: integer
      description: 每页条数
      example: 10

parameters:
  Page:
    name: page
    in: query
    required: false
    description: 页码，从 1 开始
    schema:
      type: integer
      minimum: 1
      default: 1
  PageSize:
    name: pageSize
    in: query
    required: false
    description: 每页条数，最大 100
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
  StoreIdHeader:
    name: X-Store-Id
    in: header
    required: false
    description: 门店上下文（对应顶部门店切换；不传表示总部/全部门店视角）
    schema:
      type: string
      example: ST001
  IdPath:
    name: id
    in: path
    required: true
    description: 资源 ID
    schema:
      type: string
