openapi: 3.0.3
info:
  title: 比萨 · 连锁餐饮 SaaS 管理后台 API
  version: 1.0.0
  description: |
    本规范由前端 Mock（`src/mock/*` + `src/services/*`）反推而来，与 `docs/api/*.md` 契约文档一一对应，供后端实现与联调使用。

    - 通用约定（响应包裹、分页、字段类型、错误码、跨模块引用）见 [docs/api/README.md](../README.md)
    - 各模块明细见 `docs/api/01-dashboard.md` ~ `08-ops.md`
    - 本文件只做组织与索引，具体路径定义在 `paths/*.yaml`，数据模型在 `schemas/*.yaml`

    约定：统一响应 `{ code, message, data }`；分页 `{ list, total, page, pageSize }`；状态变更 `PATCH /{resource}/{id}/status`。
servers:
  - url: https://api.example.com/api/v1
    description: 生产环境（占位）
  - url: http://localhost:3000/api/v1
    description: 本地联调
tags:
  - name: 数据
    description: 仪表盘、门店下拉
  - name: 会员
    description: 会员信息、等级配置、标签管理
  - name: 营销
    description: 满减、满折、发券、自动化营销、消息通知
  - name: 资产
    description: 卡券、积分、券包
  - name: 业务
    description: 菜单、门店、配送
  - name: 菜品
    description: 菜品管理
  - name: 订单
    description: 订单查询
  - name: 售后
    description: 售后处理
  - name: 系统
    description: 岗位、人员、系统日志
security:
  - bearerAuth: []
